<h2 style="font-size:120px;font-weight:200;line-height:1.05;letter-spacing:-2px">Do LLMs reason in circles?</h2>
<p style="font-size:44px;font-weight:300;line-height:1.35;width:1400px">Hypothesis: LLM answers keep returning to their starting point. Human answers move forward and rarely pass their first point again.</p>
<aside>State the hypothesis plainly. The rest of the talk is how we made reasoning visible enough to test it.</aside>
